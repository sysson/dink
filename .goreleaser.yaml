version: 2
project_name: dinkle

builds:
  - id: dinkle
    main: ./cmd/dinkle
    binary: dinkle
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X github.com/sysson/dink/core/version.ReleaseVersion=v{{ .Version }}
      - -X github.com/sysson/dink/core/version.BuildCommit={{ .FullCommit }}
      - -X github.com/sysson/dink/core/version.BuildDate={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  draft: true
  prerelease: auto
  mode: keep-existing
  extra_files:
    - glob: release/install.yaml
    - glob: release/install.yaml.sha256
