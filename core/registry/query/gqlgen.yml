# gqlgen configuration for the dinki metadata query layer. Regenerate with
# `go generate ./core/registry/query`. Every GraphQL type is bound to a
# hand-written model in this package whose methods resolve its fields, so only
# generated.go is produced.
schema:
  - schema.graphql

exec:
  filename: generated.go
  package: query
  # Bound on concurrently resolved list elements per field.
  worker_limit: 16

skip_mod_tidy: true

models:
  Int:
    model: github.com/99designs/gqlgen/graphql.Int32
  Long:
    model: github.com/99designs/gqlgen/graphql.Int64
  Time:
    model: github.com/99designs/gqlgen/graphql.Time
  ContentKind:
    model: github.com/99designs/gqlgen/graphql.String
  ClosureRole:
    model: github.com/99designs/gqlgen/graphql.String
  Repository:
    model: github.com/sysson/dink/core/registry/query.Repository
  Tag:
    model: github.com/sysson/dink/core/registry/query.Tag
  Manifest:
    model: github.com/sysson/dink/core/registry/query.Manifest
  Descriptor:
    model: github.com/sysson/dink/core/registry/query.Descriptor
  Platform:
    model: github.com/sysson/dink/core/registry/query.Platform
  Annotation:
    model: github.com/sysson/dink/core/registry/query.Annotation
  Blob:
    model: github.com/sysson/dink/core/registry/query.Blob
  Dependent:
    model: github.com/sysson/dink/core/registry/query.Dependent
  Location:
    model: github.com/sysson/dink/core/registry/query.Location
  Content:
    model: github.com/sysson/dink/core/registry/query.Content
  ClosureEntry:
    model: github.com/sysson/dink/core/registry/query.ClosureEntry
  ImageConfig:
    model: github.com/sysson/dink/core/registry/query.ImageConfig
  History:
    model: github.com/sysson/dink/core/registry/query.History
