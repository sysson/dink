---
# Development BuildKit backend. Privileged execution is for trusted Kind
# testing; review worker isolation before using this in a production cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkit-config
  namespace: dink-system
  labels:
    app.kubernetes.io/name: buildkit
data:
  buildkitd.toml: |
    [worker.oci]
      gc = true
      reservedSpace = "2GiB"
      maxUsedSpace = "10GiB"
      minFreeSpace = "10GiB"

    [registry."dinki.dink-system.svc.cluster.local:5000"]
      ca = ["/etc/buildkit/dinki/ca.crt"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkit
  namespace: dink-system
  labels:
    app.kubernetes.io/name: buildkit
    app.kubernetes.io/component: builder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkit
        app.kubernetes.io/component: builder
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: buildkit
          image: moby/buildkit:v0.33.1
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/buildkit/config/buildkitd.toml
            - --addr=tcp://0.0.0.0:1234
            - --tlscacert=/etc/buildkit/tls/ca.crt
            - --tlscert=/etc/buildkit/tls/tls.crt
            - --tlskey=/etc/buildkit/tls/tls.key
            - --oci-worker-snapshotter=overlayfs
          ports:
            - name: grpc
              containerPort: 1234
              protocol: TCP
          securityContext:
            runAsUser: 0
            privileged: true
          startupProbe:
            exec:
              command:
                - buildctl
                - --addr=tcp://127.0.0.1:1234
                - --tlsservername=buildkit.dink-system.svc.cluster.local
                - --tlscacert=/etc/buildkit/tls/ca.crt
                - --tlscert=/etc/buildkit/tls/tls.crt
                - --tlskey=/etc/buildkit/tls/tls.key
                - debug
                - workers
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - buildctl
                - --addr=tcp://127.0.0.1:1234
                - --tlsservername=buildkit.dink-system.svc.cluster.local
                - --tlscacert=/etc/buildkit/tls/ca.crt
                - --tlscert=/etc/buildkit/tls/tls.crt
                - --tlskey=/etc/buildkit/tls/tls.key
                - debug
                - workers
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/buildkit/config
              readOnly: true
            - name: tls
              mountPath: /etc/buildkit/tls
              readOnly: true
            - name: registry-ca
              mountPath: /etc/buildkit/dinki
              readOnly: true
            - name: cache
              mountPath: /var/lib/buildkit
      volumes:
        - name: config
          configMap:
            name: buildkit-config
        - name: tls
          secret:
            secretName: buildkit-tls
            defaultMode: 0400
        - name: registry-ca
          secret:
            secretName: dinki-tls
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: buildkit
  namespace: dink-system
  labels:
    app.kubernetes.io/name: buildkit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: buildkit
  ports:
    - name: grpc
      port: 1234
      targetPort: grpc
      protocol: TCP
