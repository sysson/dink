apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dink.yaml
  - dinki.yaml
  - dinki-node.yaml
images:
  - name: ghcr.io/sysson/dink
    newTag: sha-aa18d581901c5696a252b038a50d33a521eba5f1
  - name: ghcr.io/sysson/dinki
    newTag: sha-aa18d581901c5696a252b038a50d33a521eba5f1
configMapGenerator:
  - name: dink-config
    namespace: dink-system
    files:
      - config.json
    options:
      labels:
        app.kubernetes.io/name: dink
  - name: dinki-config
    namespace: dink-system
    files:
      - config.json=dinki-config.json
    options:
      labels:
        app.kubernetes.io/name: dinki
        app.kubernetes.io/component: registry
