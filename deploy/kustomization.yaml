apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dink.yaml
  - dinki.yaml
  - dinki-node.yaml
  - buildkit.yaml
images:
  - name: ghcr.io/sysson/dink
    #   ghcr.io/sysson/dink:v0.2.1
    newTag: sha-a3432dec5c4eba524b4d5029f7dad1a7e75ba755
  - name: ghcr.io/sysson/dinki
    #   ghcr.io/sysson/dinki:v0.2.1
    newTag: sha-a3432dec5c4eba524b4d5029f7dad1a7e75ba755
configMapGenerator:
  - name: dink-config
    namespace: dink-system
    files:
      - config.json
    options:
      labels:
        app.kubernetes.io/name: dink
  - name: dinki-config
    namespace: dink-system
    files:
      - config.json=dinki-config.json
    options:
      labels:
        app.kubernetes.io/name: dinki
        app.kubernetes.io/component: registry
