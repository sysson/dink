apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dink.yaml
  - dinki.yaml
  - dinki-node.yaml
  - buildkit.yaml
images:
  - name: ghcr.io/sysson/dink
    #   ghcr.io/sysson/dink:v0.1.2-beta.1
    newTag: sha-10d46e5b55819c9758b33c28631efd2e2bdebe30
  - name: ghcr.io/sysson/dinki
    #   ghcr.io/sysson/dinki:v0.1.2-beta.1
    newTag: sha-10d46e5b55819c9758b33c28631efd2e2bdebe30
configMapGenerator:
  - name: dink-config
    namespace: dink-system
    files:
      - config.json
    options:
      labels:
        app.kubernetes.io/name: dink
  - name: dinki-config
    namespace: dink-system
    files:
      - config.json=dinki-config.json
    options:
      labels:
        app.kubernetes.io/name: dinki
        app.kubernetes.io/component: registry
