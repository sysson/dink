---
# Optional internal OCI registry for the dink system namespace.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dinki-data
  namespace: dink-system
  labels:
    app.kubernetes.io/name: dinki
    app.kubernetes.io/component: registry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dinki
  namespace: dink-system
  labels:
    app.kubernetes.io/name: dinki
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dinki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dinki
        app.kubernetes.io/component: registry
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dinki
          image: ghcr.io/sysson/dinki
          imagePullPolicy: IfNotPresent
          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP
            - name: health
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /livez
              port: health
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/dinki
            - name: tls
              mountPath: /etc/dinki/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dinki-data
        - name: tls
          secret:
            secretName: dinki-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dinki
  namespace: dink-system
  labels:
    app.kubernetes.io/name: dinki
    app.kubernetes.io/component: registry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dinki
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      protocol: TCP
