---
# Internal OCI registry for the dink system namespace. Port 5000 is the OCI
# distribution API; port 5001 is the internal RegistryService API that only dink
# (authenticated by its client certificate subject) may call.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dinki-data
  namespace: dink-system
  labels:
    app.kubernetes.io/name: dinki
    app.kubernetes.io/component: registry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dinki
  namespace: dink-system
  labels:
    app.kubernetes.io/name: dinki
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  # The bbolt metadata file on the ReadWriteOnce volume is exclusively locked,
  # so a new pod cannot start until the old one has stopped.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dinki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dinki
        app.kubernetes.io/component: registry
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dinki
          image: ghcr.io/sysson/dinki
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/dinki/config.json
          ports:
            - name: registry
              containerPort: 5000
              protocol: TCP
            - name: api
              containerPort: 5001
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /v2/
              port: registry
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              # A pull streams several layer blobs at once, so ingest is both
              # CPU bound (TLS and digest verification) and page-cache heavy.
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/dinki
            - name: config
              mountPath: /etc/dinki/config.json
              subPath: config.json
              readOnly: true
            - name: tls
              mountPath: /etc/dinki/tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dinki-data
        - name: config
          configMap:
            name: dinki-config
        - name: tls
          secret:
            secretName: dinki-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: dinki
  namespace: dink-system
  labels:
    app.kubernetes.io/name: dinki
    app.kubernetes.io/component: registry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dinki
  ports:
    - name: registry
      port: 5000
      targetPort: registry
    - name: api
      port: 5001
      targetPort: api
