apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-registry
  namespace: dink-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e2e-registry
  template:
    metadata:
      labels:
        app: e2e-registry
    spec:
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: registry:3.0.0
          env:
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /tls/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /tls/tls.key
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: E2E
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
            - name: OTEL_TRACES_EXPORTER
              value: none
          ports:
            - name: https
              containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: auth
              mountPath: /auth
              readOnly: true
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: tls
          secret:
            secretName: e2e-registry-tls
        - name: auth
          secret:
            secretName: e2e-registry-auth
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-registry
  namespace: dink-system
spec:
  type: NodePort
  selector:
    app: e2e-registry
  ports:
    - name: https
      port: 5000
      targetPort: https
      nodePort: 32500
