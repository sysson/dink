name: CI and Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/kustomization.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve Go cache paths
        id: go-cache-paths
        run: |
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        id: go-cache
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache-paths.outputs.version }}-${{ hashFiles('go.sum', 'sdk/go.sum') }}-${{ github.sha }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache-paths.outputs.version }}-${{ hashFiles('go.sum', 'sdk/go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache-paths.outputs.version }}-
      - run: make test

  images:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: dink
            image: ghcr.io/sysson/dink
            description: Dink translates Docker Engine API requests into Kubernetes workloads.
          - target: dinki
            image: ghcr.io/sysson/dinki
            description: Dinki is the tenant OCI registry used by Dink to store and serve container images.
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: metadata
        with:
          images: ${{ matrix.image }}
          labels: |
            org.opencontainers.image.description=${{ matrix.description }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.description=${{ matrix.description }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true

  release:
    needs: [test, images]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Go Semantic Release
        id: semrel
        uses: go-semantic-release/action@v1.24.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          hooks: goreleaser
          force-bump-patch-version: true
          allow-initial-development-versions: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.semrel.outputs.version != ''
      - uses: docker/login-action@v4.6.0
        if: steps.semrel.outputs.version != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag images with semantic version
        if: steps.semrel.outputs.version != ''
        env:
          RELEASE_TAG: v${{ steps.semrel.outputs.version }}
          SOURCE_TAG: sha-${{ github.sha }}
          DINK_DESCRIPTION: Dink translates Docker Engine API requests into Kubernetes workloads.
          DINKI_DESCRIPTION: Dinki is the tenant OCI registry used by Dink to store and serve container images.
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${DINK_DESCRIPTION}" \
            --tag "ghcr.io/sysson/dink:${RELEASE_TAG}" \
            "ghcr.io/sysson/dink:${SOURCE_TAG}"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${DINKI_DESCRIPTION}" \
            --tag "ghcr.io/sysson/dinki:${RELEASE_TAG}" \
            "ghcr.io/sysson/dinki:${SOURCE_TAG}"
