name: CI and Publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - deploy/kustomization.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make test

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: dink
            image: ghcr.io/sysson/dink
          - target: dinki
            image: ghcr.io/sysson/dinki
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: metadata
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true

  pin-main-images:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install yq
        run: go install github.com/mikefarah/yq/v4@v4.53.6
      - name: Prepare image pin update
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "main advanced during this build; a newer run will update the image pins"
            exit 0
          fi

          export PATH="$(go env GOPATH)/bin:$PATH"
          yq -i '(.images[] | select(.name == "ghcr.io/sysson/dink").newTag) = strenv(IMAGE_TAG)' deploy/kustomization.yaml
          yq -i '(.images[] | select(.name == "ghcr.io/sysson/dinki").newTag) = strenv(IMAGE_TAG)' deploy/kustomization.yaml
      - uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.PUBLISH_PR_TOKEN || secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/pin-main-images
          delete-branch: true
          add-paths: deploy/kustomization.yaml
          commit-message: "chore(deploy): pin beta images to sha-${{ github.sha }}"
          title: "chore(deploy): pin beta images to sha-${{ github.sha }}"
          body: |
            Update the Kustomize image pins to the images published for `${{ github.sha }}`.

            Review the generated image references before merging.

  release-dinkle:
    needs: [test, images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
