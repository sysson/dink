name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve Go cache paths
        id: go-cache-paths
        run: |
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        id: go-cache
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache-paths.outputs.version }}-${{ hashFiles('go.sum', 'sdk/go.sum') }}-${{ github.sha }}-${{ github.job }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache-paths.outputs.version }}-${{ hashFiles('go.sum', 'sdk/go.sum') }}-
            ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go-cache-paths.outputs.version }}-
      - run: make test

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Detect release-related changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
          if grep -Eq '^(deploy/|scripts/|\.github/workflows/|\.goreleaser.yaml$)' "$RUNNER_TEMP/changed-paths"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v7
        if: steps.changes.outputs.release == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6.4.0
        if: steps.changes.outputs.release == 'true'
        with:
          version: v2.12.7
          args: check
      - name: Validate workflow and release scripts
        if: steps.changes.outputs.release == 'true'
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
          sh scripts/tests/release.sh
          sh scripts/tests/publish.sh
      - name: Install kubectl for manifest validation
        if: steps.changes.outputs.release == 'true'
        run: sh scripts/install-kubectl.sh
      - name: Validate release manifest rendering
        if: steps.changes.outputs.release == 'true'
        run: |
          output=$(mktemp -d)
          trap 'rm -rf "$output"' EXIT
          sh scripts/release-manifests.sh \
            sha256:1111111111111111111111111111111111111111111111111111111111111111 \
            sha256:2222222222222222222222222222222222222222222222222222222222222222 \
            "$output"
          (cd "$output" && sha256sum -c install.yaml.sha256)

  image-check:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [dink, dinki]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=pr-image-check-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=pr-image-check-${{ matrix.target }}

  required-checks:
    if: always()
    needs: [test, image-check, release-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          TEST: ${{ needs.test.result }}
          IMAGES: ${{ needs.image-check.result }}
          RELEASE: ${{ needs.release-check.result }}
        run: |
          test "$TEST" = success
          test "$IMAGES" = success
          test "$RELEASE" = success
