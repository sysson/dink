syntax = "proto3";

package sdk.auth.v1;

option go_package = "github.com/sysson/dink/sdk/auth/v1;auth";

service AuthPluginService {
  rpc AuthZReq(AuthZReqRequest) returns (AuthZReqResponse);
  rpc AuthZRes(AuthZResRequest) returns (AuthZResResponse);
}

message AuthZReqRequest {
  string namespace = 1;
  string user = 2;
  string user_authn_method = 3;
  string request_method = 4;
  string request_uri = 5;
  bytes request_body = 6;
  map<string, string> headers = 7;
}

message AuthZReqResponse {
  bool allow = 1;
  string msg = 2;
  string err = 3;
}

message AuthZResRequest {
  string namespace = 1;
  string user = 2;
  string user_authn_method = 3;
  string request_method = 4;
  string request_uri = 5;
  bytes request_body = 6;
  map<string, string> request_header = 7;
  bytes response_body = 8;
  map<string, string> response_header = 9;
  int32 response_status_code = 10;
}

message AuthZResResponse {
  bool allow = 1;
  string msg = 2;
  string err = 3;
}
