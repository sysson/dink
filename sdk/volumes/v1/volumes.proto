syntax = "proto3";

package sdk.volumes.v1;

option go_package = "github.com/sysson/dink/sdk/volumes/v1;volumes";

// VolumePluginService backs `docker volume create --driver <plugin>`. The plugin
// describes the claim; dink creates the PersistentVolumeClaim itself.
service VolumePluginService {
  rpc Create(CreateRequest) returns (CreateResponse);
  // Remove is called before dink deletes the claim, so the plugin can release external state.
  rpc Remove(RemoveRequest) returns (RemoveResponse);
}

message CreateRequest {
  string identity_name = 1;
  string namespace = 2;
  string name = 3;
  map<string, string> options = 4;
  map<string, string> labels = 5;
}

message CreateResponse {
  string storage_class_name = 1;
  // size is a Kubernetes quantity such as "10Gi"; empty uses dink's default.
  string size = 2;
  // access_modes are Kubernetes access modes such as "ReadWriteOnce"; empty means ReadWriteOnce.
  repeated string access_modes = 3;
  map<string, string> annotations = 4;
}

message RemoveRequest {
  string identity_name = 1;
  string namespace = 2;
  string name = 3;
  map<string, string> options = 4;
}

message RemoveResponse {}
