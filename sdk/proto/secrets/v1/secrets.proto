syntax = "proto3";

package dink.secrets.v1;

option go_package = "github.com/sysson/dink/sdk/secrets/v1;secrets";

service SecretsPluginService {
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
}

message ResolveRequest {
  message Secret {
    string name = 1;
    string ref = 2;
  }

  string identity_name = 1;
  string namespace = 2;
  repeated Secret ref = 3;
}

message ResolveResponse {
  message Secret {
    string name = 1;
    string value = 2;
    string error = 3;
  }
  repeated Secret secret = 1;
}
